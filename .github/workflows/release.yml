name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build binaries
        run: |
          bun build --compile backend/index.ts --target bun-linux-x64   --outfile dist/beiratkozas-linux-x64
          bun build --compile backend/index.ts --target bun-linux-arm64 --outfile dist/beiratkozas-linux-arm64
          bun build --compile backend/index.ts --target bun-darwin-arm64 --outfile dist/beiratkozas-macos-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
