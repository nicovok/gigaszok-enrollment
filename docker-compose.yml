services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - POCKETID_REDIRECT_URI=https://${COOLIFY_FQDN}/api/auth/callback
      - DB_PATH=/app/data/beiratkozas.db
    volumes:
      - db:/app/data
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.beiratkozas.rule=Host(`${COOLIFY_FQDN}`)
      - traefik.http.routers.beiratkozas.entrypoints=https
      - traefik.http.routers.beiratkozas.tls=true
      - traefik.http.services.beiratkozas.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/verify"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db:

networks:
  coolify:
    external: true
